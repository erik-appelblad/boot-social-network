<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: layout('Edit status update', ~{::main})}">
<head>
<title>Edit status update</title>
</head>
<body>
	<main>
		<div class="row">
			<div class="col-md-8 col-md-offset-2">

				<div class="panel panel-default">
					<div class="panel-heading">
						<div class="panel-title">
							<h1>Edit status update</h1>
						</div>
					</div>
					<div class="panel-body">
						<form th:action="@{/editstatus}" th:object="${statusUpdate}" method="post">
							<input type="hidden" th:field="*{id}">
							<input type="hidden" th:field="*{added}">

							<div class="alert alert-danger" th:if="${#fields.hasErrors('text')}">
								<span th:errors="*{text}">Error</span>
							</div>

							<div class="form-group">
								<textarea th:field="*{text}" rows="10" cols="50"
									class="form-control"></textarea>
							</div>

							<button type="submit" class="btn btn-default">Save</button>
						</form>
					</div>
				</div>

			</div>
		</div>
	</main>
</body>
</html>
